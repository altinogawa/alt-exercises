  function getPath(shape) {
    const path = new Path2D();
    switch (shape) {
      case 'circle':
        path.arc(0, 0, 50, 0, Math.PI * 2);
        break;
      case 'square':
        path.rect(-50, -50, 100, 100);
        break;
      case 'rectangle':
        path.rect(-60, -40, 120, 80);
        break;
      case 'triangle':
        path.moveTo(0, -60);
        path.lineTo(50, 40);
        path.lineTo(-50, 40);
        path.closePath();
        break;
      case 'diamond':
        path.moveTo(0, -60);
        path.lineTo(40, 0);
        path.lineTo(0, 60);
        path.lineTo(-40, 0);
        path.closePath();
        break;
      case 'star':
        for (let i = 0; i < 5; i++) {
          const angle = i * (Math.PI * 2) / 5;
          const outerX = Math.cos(angle) * 50;
          const outerY = Math.sin(angle) * 50;
          path.lineTo(outerX, outerY);
          const innerAngle = angle + Math.PI / 5;
          const innerX = Math.cos(innerAngle) * 25;
          const innerY = Math.sin(innerAngle) * 25;
          path.lineTo(innerX, innerY);
        }
        path.closePath();
        break;
      case 'heart':
        path.moveTo(0, 0);
        path.bezierCurveTo(0, -30, -50, -30, -50, 0);
        path.bezierCurveTo(-50, 30, 0, 50, 0, 60);
        path.bezierCurveTo(0, 50, 50, 30, 50, 0);
        path.bezierCurveTo(50, -30, 0, -30, 0, 0);
        break;
    }
    return path;
  }


//Square Class
class Square {
    constructor(x, y, edge, image, outline) {
        this.image = image
        this.x = x
        this.y = y
        this.edge = edge
        this.selected = false
        this.active = false
        this.outline = outline

    }
    draw(context) {
        context.drawImage(this.image, this.x, this.y, this.edge, this.edge)
        if (this.outline) {
			if(this.selected) {
			  context.linewidth = 5
              context.strokeStyle = "red"
            } else  {
              context.lineWidth = 2;
              context.strokeStyle = "gray"
			}
            context.strokeRect(this.x, this.y, this.edge, this.edge)
        }
    }
    select() {
        this.selected = !this.selected
    }

    activate() {
        this.active = !this.active
    }
}

//Shape Class
class CanvasShape {
  constructor(x, y, scaleX = 1, scaleY = 1, color = 'red', shape = 'circle') {
    this.x = x;
    this.y = y;
    this.scaleX = scaleX;
    this.scaleY = scaleY;
    this.rotation = 0;
    this.color = color;
    this.shape = shape;

    this.touchStartInfo = null;
    this.touchStartState = null;
    this.touchStartIndex = -1
  }

}

/*START FUNCTION EXTERNALIZATION - CONSIDER RENAMING!!*/
  function s_render(shape, ctx) {
    ctx.save();
    ctx.translate(shape.x, shape.y);
    ctx.rotate(shape.rotation);
    ctx.scale(shape.scaleX, shape.scaleY);
    ctx.fillStyle = shape.color;

    const path = getPath(shape.shape);
    

    ctx.fill(path);
    ctx.restore();
  }

  function s_containsPoint(shape, x, y, ctx) {
    ctx.save();
    ctx.scale(1 / shape.scaleX, 1 / shape.scaleY);
    ctx.rotate(-1 * shape.rotation);
    ctx.translate(-1 * shape.x, -1 * shape.y);


    

    const path = getPath(shape.shape)

    //Transform the mouse xy to properly match it
    const matrix = ctx.getTransform(); // DOMMatrix
    const newPoint = s_transformPoint(x, y, matrix)

    ctx.restore();

    return ctx.isPointInPath(path, newPoint.x, newPoint.y);
  }

  function s_transformPoint(x, y, m) {
    return {
        x: m.a * x + m.c * y + m.e,
        y: m.b * x + m.d * y + m.f
    };
  }

  function s_handleTouchStart(e, shape) {
    if (e.touches.length === 1) {
      shape.touchStartInfo = {
        x: e.touches[0].clientX,
        y: e.touches[0].clientY
      };
    } else if (e.touches.length === 2) {
      const [t1, t2] = e.touches;
      shape.touchStartInfo = {
        distance: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY),
        angle: Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX),
        scaleX: shape.scaleX,
        scaleY: shape.scaleY,
        rotation: shape.rotation
      };
    }
    shape.touchStartState = s_createStateShape(shape);
    shape.touchStartIndex = shapes.indexOf(shape)
  }

  function s_handleTouchMove(e, shape) {
    if (e.touches.length === 1 && shape.touchStartInfo) {
      const dx = e.touches[0].clientX - shape.touchStartInfo.x;
      const dy = e.touches[0].clientY - shape.touchStartInfo.y;
      shape.x += dx;
      shape.y += dy;
      shape.touchStartInfo.x = e.touches[0].clientX;
      shape.touchStartInfo.y = e.touches[0].clientY;
    } else if (e.touches.length === 2 && shape.touchStartInfo) {
      const [t1, t2] = e.touches;
      const newDistance = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const newAngle = Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX);

      const scaleFactor = newDistance / shape.touchStartInfo.distance;
      shape.scaleX = shape.touchStartInfo.scaleX * scaleFactor;
      shape.scaleY = shape.touchStartInfo.scaleY * scaleFactor;
      shape.rotation = shape.touchStartInfo.rotation + (newAngle - shape.touchStartInfo.angle);
    }
  }

  function s_handleTouchEnd(e, shape) {
    shape.touchStartInfo = null;
    AddToUndo(new ShapeCommand(shape, shape.touchStartIndex, shape.touchStartState, s_createStateShape(shape)), true)
  }

  function s_createStateShape(shape) {
    let newState = new ShapeState(shape.x, shape.y, shape.rotation, shape.scaleX, shape.scaleY)
    return newState
  }
/*END THE FUNCTION EXTERNALIZATION*/

class LinePath {
    constructor(points, thickness, color) {
		this.path = null
        this.points = points
        this.thickness = thickness
        this.color = color

    }
}

class ShapeState {
  constructor(x, y, rot, scaleX, scaleY) {
    this.x = x
    this.y = y
    this.rotation = rot
    this.scaleX = scaleX
    this.scaleY = scaleY
  }
}

//Command class for history
class ShapeCommand {
    constructor(shape, index, state1, state2) {
        this.shape = shape
        this.index1 = index
        this.state1 = state1
        this.state2 = state2
    }

    undo() {
      this.shape.x = this.state1.x
      this.shape.y = this.state1.y
      this.shape.scaleX = this.state1.scaleX
      this.shape.scaleY = this.state1.scaleY
      this.shape.rotation = this.state1.rotation

      if(shapes.indexOf(this.shape) !== this.index1) {
        //NEED TO MOVE IT TO THIS INDEX
        shapes.splice(shapes.indexOf(this.shape), 1);
        shapes.splice(this.index1, 0, this.shape)
      }
    }

    redo() {
      this.shape.x = this.state2.x
      this.shape.y = this.state2.y
      this.shape.scaleX = this.state2.scaleX
      this.shape.scaleY = this.state2.scaleY
      this.shape.rotation = this.state2.rotation

      if(shapes.indexOf(this.shape) != shapes.length - 1) {
        //NEED TO MOVE IT TO THE END!
        shapes.splice(shapes.indexOf(this.shape), 1);
        shapes.push(this.shape)
      }
    }
}

class CreateShapeCommand {
    constructor(shape) {
        this.shape = shape
    }

    undo() {
      let index = shapes.indexOf(this.shape);

      if (index != -1) {
        shapes.splice(index, 1);
      }
    }

    redo() {
      let index = shapes.indexOf(this.shape);

      if (index == -1) {
        shapes.push(this.shape);
      }
    }
}

class DeleteShapeCommand {
    constructor(shape, index) {
        this.shape = shape
        this.index = index
    }

    undo() {
      let i = shapes.indexOf(this.shape);

      if (i == -1) {
        shapes.splice(this.index, 0, this.shape);
      }
    }

    redo() {
      if (shapes[this.index] == this.shape) {
        shapes.splice(this.index, 1);
      }
    }
}

class CreateLineCommand {
    constructor(line) {
        this.line = line
    }

    undo() {
      let index = lines.indexOf(this.line);

}

class DeleteLineCommand {
    constructor(line, index) {

    }

}

function AddToUndo(command, forceClear = false) {
  undoHistory.push(command)
  if(undoHistory.length > MAX_HIST) {
    undoHistory.splice(0, undoHistory.length - MAX_HIST)
  }
  if(forceClear) {
    redoHistory.length = 0
  }
  ResetDoButtons()
}

function AddToRedo(command) {
  redoHistory.push(command)
  if(redoHistory.length > MAX_HIST)  {
    redoHistory.splice(0, redoHistory.length - MAX_HIST)
  }
  ResetDoButtons()
}

  } else {

  }
}

let getMouseCoords = (canvas, event) => {
    let canvasCoords = canvas.getBoundingClientRect()
    return {
        x: event.pageX - canvasCoords.left,
        y: event.pageY - canvasCoords.top
    }
}

let cursorInRect = (mouseX, mouseY, rectX, rectY, rectW, rectH) => {
    let xLine = mouseX > rectX && mouseX < rectX + rectW
    let yLine = mouseY > rectY && mouseY < rectY + rectH

    return xLine && yLine
}


function playSequence(sequence) {
      let index = 0;

      function playNext() {
        if (index < sequence.length) {
          const clip = sequence[index];
          index++;

          // Reset playback position
          clip.currentTime = 0;

          // Play and wait for it to finish
          clip.onended = playNext;  // overwrite instead of addEventListener
          clip.play();
        }
      }

      playNext();
    }

function saveCroppedScreenshot() {

  tempCanvas.width = canvas.width - menuWidth - 1; // exclude leftmost 100px
  tempCanvas.height = canvas.height;

  // Draw the cropped portion of the original canvas
  tempCtx.drawImage(
    canvas,          // source canvas
    menuWidth + 1, 0,          // start cropping at x=menuWidth, y=0
    canvas.width - menuWidth - 1, canvas.height, // crop width & height
    0, 0,            // destination x,y
    canvas.width - menuWidth - 1, canvas.height  // destination width & height
  );

  // Export the cropped image
  const image = tempCanvas.toDataURL('image/png');
  const link = document.createElement('a');
  link.href = image;
  link.download = 'card-screenshot.png';
  document.body.appendChild(link); // must be in DOM for Firefox
  link.click();
  document.body.removeChild(link);

function redrawPoints(line) {
  if(line.points.length < 2) { return; }
  //ctx.clearRect(0, 0, canvas.width, canvas.height); // optional: clear before redraw
  ctx.beginPath();
for (let i = 0; i < linePoints.points.length - 1; i++) {
  ctx.moveTo(linePoints.points[i].x, linePoints.points[i].y);
  ctx.lineTo(linePoints.points[i + 1].x, linePoints.points[i + 1].y);
}
  ctx.strokeStyle = line.color;
  ctx.lineWidth = line.thickness;
  ctx.lineCap = 'round'
  ctx.stroke();
  ctx.closePath();
}

function redrawPath(line) {
  //Set up the path if it's not set up already!
  if(line.path == null || !(line.path instanceof Path2D)) {
	//create the path
	let newPath = new Path2D()
        for (let i = 0; i < line.points.length - 1; i++) {
          newPath.moveTo(line.points[i].x, line.points[i].y);
          newPath.lineTo(line.points[i + 1].x, line.points[i + 1].y);
        }
        //newPath.closePath();


	line.path = newPath
  }
	


  //ctx.clearRect(0, 0, canvas.width, canvas.height); // optional: clear before redraw
  ctx.strokeStyle = line.color;
  ctx.lineWidth = line.thickness;
  ctx.lineCap = 'round'
  ctx.stroke(line.path)
}

/* RDP Algorithm to smooth the drawing lines, thank you Copilot!! */


// Utility: squared distance from point C to segment AB
function pointSegmentDistSq(A, B, C) {
  const vx = B.x - A.x, vy = B.y - A.y;
  const wx = C.x - A.x, wy = C.y - A.y;
  const c1 = vx * wx + vy * wy;
  const c2 = vx * vx + vy * vy;
  let t = c2 !== 0 ? c1 / c2 : 0;
  t = Math.max(0, Math.min(1, t));
  const px = A.x + t * vx, py = A.y + t * vy;
  const dx = C.x - px, dy = C.y - py;
  return dx * dx + dy * dy;
}

// Ramer–Douglas–Peucker simplification
function simplifyRDP(points, epsilon = 1.0) {
  if (!points || points.length <= 2) return points.slice();
  const epsSq = epsilon * epsilon;

  function rdp(startIdx, endIdx, out) {
    let maxDistSq = -1;
    let index = -1;
    const A = points[startIdx];
    const B = points[endIdx];

    for (let i = startIdx + 1; i < endIdx; i++) {
      const dSq = pointSegmentDistSq(A, B, points[i]);
      if (dSq > maxDistSq) {
        maxDistSq = dSq;
        index = i;
      }
    }

    if (maxDistSq > epsSq) {
      rdp(startIdx, index, out);
      rdp(index, endIdx, out);
    } else {
      out.push(points[startIdx]); // keep start
      // end will be added by upper recursion or finalization
    }
  }

  const out = [];
  rdp(0, points.length - 1, out);
  out.push(points[points.length - 1]); // ensure last point
  return out;
}

// Optional: drop points that are too close to previous
function dedupeNear(points, minDist = 0.5) {
  const minSq = minDist * minDist;
  const out = [];
  let prev = null;
  for (const p of points) {
    if (!prev) {
      out.push(p);
      prev = p;
    } else {
      const dx = p.x - prev.x, dy = p.y - prev.y;
      if (dx * dx + dy * dy >= minSq) {
        out.push(p);
        prev = p;
      }
    }
  }
  return out;
}

// Optional: simple moving average smoothing
function smooth(points, window = 3) {
  if (window < 2) return points.slice();
  const half = Math.floor(window / 2);
  const out = [];
  for (let i = 0; i < points.length; i++) {
    let sx = 0, sy = 0, count = 0;
    for (let k = -half; k <= half; k++) {
      const j = Math.min(points.length - 1, Math.max(0, i + k));
      sx += points[j].x; sy += points[j].y; count++;
    }
    out.push({ x: sx / count, y: sy / count });
  }
  return out;
}

// Example pipeline:
function cleanPolyline(rawPoints, { minSpacing = 0.5, smoothWindow = 3, epsilon = 2.0 } = {}) {
  const deduped = dedupeNear(rawPoints, minSpacing);
  const smoothed = smoothWindow > 1 ? smooth(deduped, smoothWindow) : deduped;
  const simplified = simplifyRDP(smoothed, epsilon);
  return simplified;
}

const SAVE_KEY = 'shapesProject.v1';

function serializeScene(shapes, lines) {
  // Make sure these are pure JSON-serializable (no methods/functions)
  const payload = {
    version: 1,
    savedAt: new Date().toISOString(),
    shapes,
    lines,
  };
  return JSON.stringify(payload);
}

function saveScene(shapes, lines) {
  try {
    //POSSIBLY CATCH OVERWRITE HERE

  }
}
